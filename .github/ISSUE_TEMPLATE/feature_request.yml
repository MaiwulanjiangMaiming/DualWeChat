name: Feature request
description: 建议一个新功能或体验改进
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        DualWeChat 希望保持小而可靠。请先描述你遇到的真实问题，而不只是方案。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在哪里不方便？在什么场景下会发生？
      placeholder: "例如：每次微信更新后都要重新选图标……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
      description: 如果有具体交互或命令示例，请写在这里
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现在你是如何绕过这个问题的？

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options:
        - 安装 / 更新脚本
        - 图标生成
        - README / 文档
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue，确认这不是重复建议
          required: true
        - label: 这个功能不依赖破解微信客户端或绕过账号风控
          required: true

name: Bug report
description: 安装、更新或启动时遇到问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先看 README 的「常见问题」和「故障排查」。
        请勿粘贴账号、手机号、聊天内容或其他隐私信息。

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: "运行 `sw_vers -productVersion` 获取"
      placeholder: "26.6.2"
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: 芯片
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true

  - type: input
    id: wechat
    attributes:
      label: 微信版本
      description: "原版微信 → 关于微信，或运行 `./setup.sh --check`"
      placeholder: "4.2.0 (270348)"
    validations:
      required: true

  - type: input
    id: dualwechat
    attributes:
      label: DualWeChat 版本
      description: "副本 → 关于，或运行 `./setup.sh --check`；未安装可写“无”"
      placeholder: "4.2.0 (270348)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - ./setup.sh
        - ./update.sh
        - 手动执行命令
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: 图标主题
      options:
        - Metal
        - Aurora
        - Neon
        - Lava
        - Matrix
        - 原版图标
        - 未选择/不适用
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行 ./setup.sh
        2. 选择 Aurora
        3. ……
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 终端输出 / 日志
      description: 可先运行 `./setup.sh --check`，再粘贴报错
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 可直接拖拽图片到此处；请先遮挡账号与聊天内容

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经搜索过已有 Issue，并阅读了 README 的常见问题
          required: true
        - label: 我使用的是最新版项目代码
          required: true
        - label: 我没有在内容中暴露账号、手机号或聊天记录
          required: true
